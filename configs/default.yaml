# AutoCut-Agent Default Configuration

agent:
  name: "AutoCut Agent"
  workers: 4
  log_level: INFO

database:
  url: "sqlite+aiosqlite:///agent.db"
  pool_size: 5

redis:
  url: "redis://localhost:6379/0"
  enabled: false

resources:
  - id: "cpu"
    type: "cpu"
    exclusive: false
    max_concurrent: 10

queues:
  - name: "default"
    type: "priority"
    workers: 2
    priority: 0

triggers:
  - type: "api"
    enabled: true

monitoring:
  metrics:
    enabled: true
    prometheus_port: 9090
  logging:
    format: "json"
    level: "INFO"
    file: "logs/agent.log"

api:
  host: "0.0.0.0"
  port: 8080
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"

llm:
  provider: "openai"
  model: "gpt-4"
  temperature: 0.3
