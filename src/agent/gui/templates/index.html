<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCut Agent</title>
    <link rel="stylesheet" href="/gui/static/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h2>AutoCut Agent</h2>
                <span class="version">v0.1.0</span>
            </div>
            <ul class="nav-items">
                <li class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')">
                    <span class="nav-icon">&#9632;</span> Dashboard
                </li>
                <li class="nav-item" data-page="pipelines" onclick="navigateTo('pipelines')">
                    <span class="nav-icon">&#9654;</span> Pipelines
                </li>
                <li class="nav-item" data-page="templates" onclick="navigateTo('templates')">
                    <span class="nav-icon">&#9998;</span> Templates
                </li>
                <li class="nav-item" data-page="programs" onclick="navigateTo('programs')">
                    <span class="nav-icon">&#9881;</span> Programs
                </li>
                <li class="nav-item" data-page="storage" onclick="navigateTo('storage')">
                    <span class="nav-icon">&#128193;</span> Storage
                </li>
                <li class="nav-item" data-page="queues" onclick="navigateTo('queues')">
                    <span class="nav-icon">&#9776;</span> Queues
                </li>
                <li class="nav-item" data-page="compile" onclick="navigateTo('compile')">
                    <span class="nav-icon">&#128172;</span> LLM Compile
                </li>
                <li class="nav-item" data-page="monitoring" onclick="navigateTo('monitoring')">
                    <span class="nav-icon">&#128200;</span> Monitoring
                </li>
                <li class="nav-item" data-page="settings" onclick="navigateTo('settings')">
                    <span class="nav-icon">&#9881;</span> Settings
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main id="content">
            <!-- Pages rendered dynamically by JS -->
        </main>
    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container"></div>

    <script src="/gui/static/js/api.js"></script>
    <script src="/gui/static/js/components.js"></script>
    <script src="/gui/static/js/pages.js"></script>
    <script src="/gui/static/js/app.js"></script>
</body>
</html>
